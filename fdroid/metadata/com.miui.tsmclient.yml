Name: HyperOS Wallet Shortcut
Summary: Unofficial power-button shortcut utility for compatible HyperOS devices

Description: |-
  An independent, unofficial open-source compatibility utility that allows
  compatible Xiaomi, Redmi and POCO devices to open Google Wallet using the
  physical power-button double-press shortcut.

  This project is not affiliated with, endorsed by, sponsored by, or associated
  with Xiaomi, Google, Shizuku, or their affiliates.

  Built-in Shizuku setup can configure the shortcut without root. Shizuku can
  be stopped after setup.

  The Android package identifier `com.miui.tsmclient` is used solely for
  interoperability because compatible HyperOS versions route the relevant
  system shortcut to that package identifier.

  This project does not contain or distribute Xiaomi's Mi Pay application,
  Xiaomi proprietary code, or Xiaomi proprietary assets.

  Do not install this app on a device that already contains Xiaomi's genuine
  `com.miui.tsmclient` / Mi Pay application.

AntiFeatures:
  NonFreeDep:
    en-US: Requires Google Wallet, which is proprietary software.

