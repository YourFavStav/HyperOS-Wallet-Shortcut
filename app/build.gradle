plugins {
    id 'com.android.application'
}

android {
    namespace 'com.miui.tsmclient'
    compileSdk 35

    defaultConfig {
        applicationId 'com.miui.tsmclient'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
